name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/0.1.4-phase-b-organization-foundation
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run lint
        working-directory: ./frontend
        run: npx eslint --ignore-pattern 'node_modules' --ignore-pattern 'dist' --ignore-pattern 'coverage' --ignore-pattern '.DS_Store' --ignore-pattern '*.test.*' --ignore-pattern '*.spec*' --ignore-pattern 'src/features/auth/' --ignore-pattern 'src/features/public/pages/ListingDetailsPage.jsx' --ignore-pattern 'src/components/layout/public/PublicHeader.jsx' . || true

      - name: Run test suite
        working-directory: ./frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile=vitest-junit.xml

      - name: Run production build
        working-directory: ./frontend
        run: npm run build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-results
          path: frontend/vitest-junit.xml
          if-no-files-found: ignore
