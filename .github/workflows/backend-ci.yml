name: Backend CI

on:
  push:
    branches:
      - feature/0.1.3-identity-authorization
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-cache-${{ runner.os }}-${{ hashFiles('Backend/pom.xml') }}
          restore-keys: |
            maven-cache-${{ runner.os }}-

      - name: Backend clean verify
        working-directory: ./Backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Backend/target/surefire-reports

      - name: Fail on test failures
        if: failure()
        run: |
          echo "Backend tests failed. See Surefire reports for details."
          exit 1
