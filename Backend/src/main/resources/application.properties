spring.application.name=HostelOs
spring.config.import=optional:file:.env[.properties]

media.storage-provider=${MEDIA_STORAGE_PROVIDER:CLOUDINARY}
media.enabled=${HOSTELOS_MEDIA_ENABLED:true}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:hostelos}
cloudinary.timeout-seconds=${CLOUDINARY_TIMEOUT_SECONDS:30}
media.upload-signature-ttl-seconds=${MEDIA_UPLOAD_SIGNATURE_TTL_SECONDS:600}
media.delivery-url-ttl-seconds=${MEDIA_DELIVERY_URL_TTL_SECONDS:900}
media.max-images-per-property=${MEDIA_MAX_IMAGES_PER_PROPERTY:20}
media.max-bytes-per-image=${MEDIA_MAX_BYTES_PER_IMAGE:10485760}
media.max-pixels-per-image=${MEDIA_MAX_PIXELS_PER_IMAGE:25000000}
media.allowed-formats=${MEDIA_ALLOWED_FORMATS:jpg,jpeg,png,webp}
media.cleanup-interval-ms=${MEDIA_CLEANUP_INTERVAL_MS:3600000}

spring.datasource.url=${HOSTELOS_DB_URL:jdbc:mysql://localhost:3306/hostelos?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${HOSTELOS_DB_USERNAME}
spring.datasource.password=${HOSTELOS_DB_PASSWORD:#Rahul8620}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HostelOsPool
spring.datasource.hikari.maximum-pool-size=${HOSTELOS_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

server.port=${HOSTELOS_SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=HOSTELOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

hostelos.security.cookie-secure=false
hostelos.bootstrap.admin.enabled=${HOSTELOS_BOOTSTRAP_ADMIN_ENABLED:false}
hostelos.bootstrap.admin.login-identifier=${HOSTELOS_BOOTSTRAP_ADMIN_LOGIN:}
hostelos.bootstrap.admin.display-name=${HOSTELOS_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
hostelos.bootstrap.admin.password=${HOSTELOS_BOOTSTRAP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
