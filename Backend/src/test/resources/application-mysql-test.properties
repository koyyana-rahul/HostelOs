# MySQL 8 Isolated Test Profile
# Required environment variables:
#   HOSTELOS_TEST_DB_URL
#   HOSTELOS_TEST_DB_USERNAME
#   HOSTELOS_TEST_DB_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${HOSTELOS_TEST_DB_URL}
spring.datasource.username=${HOSTELOS_TEST_DB_USERNAME}
spring.datasource.password=${HOSTELOS_TEST_DB_PASSWORD}

spring.datasource.hikari.pool-name=HostelOsMysqlTestPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

management.endpoint.health.show-details=never
